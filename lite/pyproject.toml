[project]
name = "ai-lab-gateway-lite"
version = "0.1.0"
description = "Minimal OAuth-protected MCP gateway for Linux devices over WireGuard"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "starlette>=0.37,<2",
  "uvicorn>=0.31,<1",
  "authlib>=1.3,<2",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
[project.scripts]
ai-lab-gateway-lite = "ai_lab_gateway_lite.server:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
