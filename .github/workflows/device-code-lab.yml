name: Device-code pairing laboratory

on:
  workflow_dispatch:
  push:
    paths:
      - "src/ai_lab_gateway/device_code*.py"
      - "src/ai_lab_gateway/sshsig.py"
      - "scripts/device_code_pair_linux.py"
      - "scripts/run_device_code_lab.py"
      - "scripts/install_ai_lab_device.sh"
      - "tests/test_device_code*.py"
      - ".github/workflows/device-code-lab.yml"

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python cryptography for test/server only
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Verify ssh-keygen availability
        run: ssh-keygen -V 2>&1 | grep -q "usage:" || test "${PIPESTATUS[0]}" -eq 1
      - name: Run entire isolated device-code test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_device_code*.py' -v
