name: Stage 5 signed profile grant policy (isolated)

on:
  pull_request:
    paths:
      - 'src/ai_lab_gateway/signed_profile_grants.py'
      - 'tests/test_signed_profile_grants.py'
      - 'docs/access-profile-grants-stage5.md'
      - '.github/workflows/profile-grant-lab.yml'
  push:
    branches:
      - 'feat/device-access-profiles-v1'
    paths:
      - 'src/ai_lab_gateway/signed_profile_grants.py'
      - 'tests/test_signed_profile_grants.py'
      - '.github/workflows/profile-grant-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<49'
      - name: Run synthetic signed profile tests (no sudo)
        run: python -m pytest -q tests/test_signed_profile_grants.py
