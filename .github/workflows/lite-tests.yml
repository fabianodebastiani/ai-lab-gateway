name: Lite isolated tests
on:
  push:
    branches: [gateway-lite]
    paths: ["lite/**", ".github/workflows/lite-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lite
        run: python -m pip install -e './lite[dev]'
      - name: Run unit tests
        run: python -m pytest -q lite/tests
