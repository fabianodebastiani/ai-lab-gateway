name: Supervised root broker laboratory

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/supervised-root-operations"
    paths:
      - "scripts/privilege_broker_daemon.py"
      - "tests/test_privilege_broker.py"
      - "tests/test_approval_web.py"
      - "tests/test_device_code_root_inventory.py"
      - ".github/workflows/supervised-root-broker-lab.yml"
  pull_request:
    paths:
      - "scripts/privilege_broker_daemon.py"
      - "tests/test_privilege_broker.py"
      - "tests/test_approval_web.py"
      - "tests/test_device_code_root_inventory.py"
      - ".github/workflows/supervised-root-broker-lab.yml"

permissions:
  contents: read

jobs:
  broker-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Test privilege request, distinct human approval, one-time root execution and denial
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_privilege_broker.py tests/test_approval_web.py tests/test_device_code_root_inventory.py -q
